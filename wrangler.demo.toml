# Cloudflare Workers configuration for demo.reportar.app (TEST database)
# Build:  npm run build:demo && npx opennextjs-cloudflare build
# Deploy: npx wrangler deploy --config wrangler.demo.toml

name = "reportaweb-demo"
main = ".open-next/worker.js"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
minify = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# DEMO: Points to TEST database (oyrokyyaeaeqzlsgxtto)
# Custom domains (estándar 2026-07-22): dev.reportar.app = interno/BD TEST.
# demo.reportar.app se mantiene temporalmente durante la transición; retirar cuando
# no queden enlaces apuntando a demo.
routes = [
  { pattern = "dev.reportar.app", custom_domain = true },
  { pattern = "demo.reportar.app", custom_domain = true },
]

